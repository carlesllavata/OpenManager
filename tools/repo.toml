# What the common OPEN3D tools need to know about this repository. tools/repo.py reads it:
# tools/check.ps1 runs the checks, "python -I tools/repo.py version set X.Y.Z" writes a new version,
# "python -I tools/repo.py package" makes the release package and "release X.Y.Z" the release.

# Where the version lives (`source`) and the other places that repeat it. Each one is a file and a
# pattern whose one group is the version; "^" is the start of a line. The bundle's PackageContents.xml
# is not a place: tools/build.py writes it from the source.
[version]
source = { file = "package/OpenManager/openmanager/window.py", pattern = '^VERSION = "([^"]+)"' }
places = [
    { file = "README.md", pattern = '^> Status: [^(\n]*\(v([^)\n]+)\)' },
]

# The checks, in the order they run. `full = true` marks one that only tools/check.ps1 -Full runs.
[[check]]
name = "ruff format"
run = ["ruff", "format", "--check", "."]

# Fails today, on the 28 broad `except Exception` blocks of the package (35 findings). They are put right
# in a task of their own, and nothing is silenced meanwhile.
[[check]]
name = "ruff check"
run = ["ruff", "check", "."]

# With a Python that has no PySide6, the tests of the window and of the dialogs are skipped.
[[check]]
name = "tests"
run = ["python", "tests/run.py"]

# The same tests with the Python of 3ds Max, which has PySide6: none is skipped. 3ds Max is not started.
[[check]]
name = "tests with the Python of 3ds Max"
run = ["3dsmax-python", "tests/run.py"]
full = true

# The release package: dist/openmanager-<version>-windows-x64-3dsmax.zip, with OpenManager.bundle at its
# root and LICENSE inside it, and dist/SHA256SUMS.txt. The launcher installs it from there. tools/build.py
# makes the bundle in dist/.
[package]
name = "OpenManager"
bundle = "OpenManager.bundle"
build = [["python", "tools/build.py"]]
files = [{ from = "dist/OpenManager.bundle", to = "OpenManager.bundle" }]
